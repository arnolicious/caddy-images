name: Build Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        subfolder:
          - l4-crowdsec
          - docker-cloudflare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.subfolder }}
          load: true
          tags: temp-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get Caddy version
        id: caddy
        run: |
          CADDY_VERSION=$(docker run --rm temp-image:latest caddy version | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$CADDY_VERSION" >> $GITHUB_OUTPUT

      - name: Build and push with final tag
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.subfolder }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.subfolder }}:${{ steps.caddy.outputs.version }}-${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.subfolder }}:latest
          cache-from: type=gha
